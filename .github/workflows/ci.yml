# HYG.3 (2026-07-09): lock in the gated Phase-4b scaffold while 4b-full work
# churns.  Runs the full pytest suite (all bit-parity gates), the numbered
# examples on the synthetic table, and the vendored Phase-4b verification
# harness.  DYNAMO-M-dependent paths (example 05, Phase-4a parity) skip/exit
# cleanly by design when DYNAMO-M is absent, so no secret checkout is needed.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # py3.11 floor: honeybees 1.2.0 -> zarr>=3.0.5 requires >=3.11.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: pip install -e .[dev]

      - name: Verify main-engine dependency (honeybees) is importable
        # honeybees is a core dependency (main engine run_mesa_native_full);
        # fail the build at install time rather than at first model call.
        run: python -c "import floodadapt_abm; assert floodadapt_abm.HONEYBEES_AVAILABLE, 'honeybees failed to import'"

      - name: Run test suite (all parity gates)
        run: pytest tests/ -q

      - name: Run examples on the synthetic table (01-04, 06, 07, 08)
        # 05 and 07 need DYNAMO-M; they print a notice and exit 0 without it,
        # so they are included too — the guard itself is under test.
        working-directory: examples_engine
        run: |
          python 01_quickstart.py
          python 02_rules_comparison.py
          python 03_custom_rule.py
          python 04_monte_carlo_uncertainty.py
          python 05_dynamo_live_parity.py
          python 06_mesa_native_driving.py
          python 07_mesa_native_full.py
          python 08_income_perception_insurance.py
